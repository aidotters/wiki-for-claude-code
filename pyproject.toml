[project]
name = "wiki-for-claude-code-agent"
version = "0.1.0"
description = "LLM-Wiki for Claude Code: agent layer (Phase 1)"
requires-python = ">=3.12"
dependencies = [
    "python-frontmatter>=1.1",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "jsonschema>=4.21",
    "anthropic>=0.40",
    "claude-agent-sdk>=0.1.77",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-pyyaml>=6.0",
    "types-jsonschema>=4.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = ["frontmatter.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-v", "--tb=short"]

[project.scripts]
agent = "agent.runners.local:main"
